<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千寻融合控制台 (qianxun console)</title>
<style>
 :root{--bg:#0f1115;--card:#171a21;--line:#2a2f3a;--fg:#e6e9ef;--dim:#8b93a3;
       --ok:#3fb950;--run:#58a6ff;--warn:#d29922;--err:#f85149;--stop:#b979db}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
   font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",monospace}
 header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;
   align-items:center;position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
 header h1{font-size:16px;margin:0} header .sub{color:var(--dim);font-size:12px}
 .chip{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
 .chip b{color:var(--fg)}
 main{display:flex;gap:16px;padding:16px 20px;align-items:flex-start}
 .col{flex:1;min-width:0} .col.wide{flex:1.8}
 .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
       padding:12px 14px;margin-bottom:12px}
 h2{font-size:13px;color:var(--dim);margin:0 0 8px;text-transform:uppercase;letter-spacing:.5px}
 label{font-size:12px;color:var(--dim);display:block;margin:8px 0 3px}
 input[type=text],input[type=number],textarea{width:100%;background:#0b0d11;color:var(--fg);
   border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;font-family:inherit}
 textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
 .row{display:flex;gap:10px} .row>*{flex:1}
 .job{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);
      cursor:pointer} .job:last-child{border-bottom:none} .job:hover{background:#1c2130}
 .state{padding:2px 8px;border-radius:20px;font-size:12px;white-space:nowrap}
 .s-QUEUED{background:#2a2f3a;color:var(--dim)} .s-RUNNING{background:#12263f;color:var(--run)}
 .s-COMPLETE{background:#0f2b18;color:var(--ok)} .s-STOPPED{background:#291a3f;color:var(--stop)}
 .s-ERROR{background:#3f1216;color:var(--err)}
 .round{background:#1f4a3a;color:#7ee2a8;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;flex:none}
 .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}
 .bar>i{display:block;height:100%;background:var(--run)}
 .meta{color:var(--dim);font-size:12px}
 button{background:#1f232c;color:var(--fg);border:1px solid var(--line);border-radius:6px;
        padding:4px 10px;cursor:pointer;font-size:12px}
 button:hover{border-color:var(--dim)} button.danger{color:var(--err);border-color:#4a2328}
 button.danger:hover{background:#3f1216} button.ok{color:var(--ok);border-color:#1e3b26}
 button:disabled{opacity:.5;cursor:not-allowed}
 #log{height:240px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;
      background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:8px;white-space:pre-wrap}
 .expr{font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:3px 0;
       border-bottom:1px dashed #232833;display:flex;gap:8px;align-items:baseline}
 .expr .st{width:90px;flex:none;white-space:nowrap}
 .expr .aid{width:84px;flex:none;color:var(--ok);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .expr .m{width:62px;flex:none;text-align:right;color:var(--dim);white-space:nowrap}
 .stx-COMPLETE{color:var(--ok)} .stx-ERROR,.stx-FAILED,.stx-TIMEOUT,.stx-POLL_ERROR{color:var(--err)}
 .stx-QUEUED{color:var(--dim)} .stx-RUNNING,.stx-submitted{color:var(--run)} .stx-SUBMIT_FAILED{color:var(--warn)}
 .badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;margin-left:6px}
 .b-pass{background:#0f2b18;color:var(--ok)} .b-warn{background:#2a1f0f;color:var(--warn)}
 .b-fail{background:#3f1216;color:var(--err)} .b-none{background:#22262f;color:var(--dim)}
 .empty{color:var(--dim);font-size:12px;padding:8px 0}
 .stat{display:inline-block;margin-right:8px;font-size:12px;padding:2px 8px;border-radius:12px;background:#20242e}
 .stat .n{font-weight:700}
 .headrow{display:flex;gap:8px;color:var(--dim);font-size:11px;padding:2px 0;border-bottom:1px solid var(--line)}
 .headrow .m{width:62px;text-align:right}
 .headrow .aid{width:84px} .headrow .st{width:90px}
 .toast{position:fixed;bottom:20px;right:20px;background:#1f4a3a;border:1px solid var(--ok);
   color:var(--fg);padding:10px 14px;border-radius:8px;font-size:13px;display:none;z-index:99;max-width:60vw}
 .hint{font-size:11.5px;color:var(--dim);margin-top:4px}
 /* check 面板 */
 .check-panel{margin:8px 0;padding:10px 12px;background:#0b0d11;border:1px solid var(--line);border-radius:8px;font-size:12px}
 .check-panel h3{margin:0 0 6px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
 .check-row{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid #1c2130;font-size:12px}
 .check-row:last-child{border-bottom:none}
 .check-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Menlo,monospace}
 .check-val{width:80px;text-align:right;font-family:ui-monospace,Menlo,monospace;color:var(--dim)}
 .check-result{width:65px;text-align:right}
 .check-summary{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
 .check-panel .close{cursor:pointer;color:var(--dim);font-size:14px;line-height:1}
 .check-panel .close:hover{color:var(--fg)}
 .check-loading{color:var(--run);font-size:12px;padding:8px 0}
 .pc-row{display:flex;gap:6px;align-items:center;padding:2px 0}
 .pc-name{flex:1;font-family:ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .pc-val{width:70px;text-align:right;font-family:ui-monospace,Menlo,monospace}
 .pc-max{font-weight:700;font-size:13px;margin:6px 0}
</style></head><body>
<header>
 <h1>千寻融合控制台</h1>
 <span class="chip">并发 <input type="number" id="concInput" min="1" max="32" style="width:56px;display:inline-block;padding:2px 6px">
   <button id="concApply" class="ok" style="padding:2px 8px">应用</button></span>
 <span class="chip">批大小 <input type="number" id="bsInput" min="1" max="10" style="width:48px;display:inline-block;padding:2px 6px">
   <button id="bsApply" class="ok" style="padding:2px 8px">应用</button></span>
 <span class="chip">alpha 回填 <b id="qty">?</b></span>
 <span class="sub" id="health"></span>
 <span style="flex:1"></span>
 <span class="sub">暂停/恢复/取消=即时生效 · 并发影响正在/即将跑的批次</span>
</header>
<main>
 <div class="col">
  <div class="card"><h2>控制台 · 手动提交</h2>
   <div class="row">
    <div><label>批次名(可选)</label><input type="text" id="fName" placeholder="gem_usa_01"></div>
    <div><label>producer(来源)</label><input type="text" id="fProd" value="控制台" placeholder="阿法"></div>
    <div><label>cap 只跑前 N 条(可选)</label><input type="number" id="fCap" placeholder="全部"></div>
   </div>
   <label>settings(JSON) — region/universe/中性化等</label>
   <textarea id="fSettings" rows="5" spellcheck="false">{"type":"REGULAR","instrumentType":"EQUITY","region":"USA","universe":"TOP3000","delay":1,"decay":1,"neutralization":"SUBINDUSTRY","truncation":0.08,"pasteurization":"ON","unitHandling":"VERIFY","nanHandling":"ON","language":"FASTEXPR","visualization":false}</textarea>
   <label>expressions(每行一条)</label>
   <textarea id="fExprs" rows="6" spellcheck="false">rank(close)
-rank(volume)</textarea>
   <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
     <button id="fSubmit" class="ok">提交批次</button>
     <span class="hint" id="fResult"></span></div>
  </div>
  <div class="card"><h2>AI 批次（batch_no = B+日期-序号）</h2><div id="jobs"><div class="empty">加载中…</div></div></div>
 </div>
 <div class="col wide">
  <div class="card">
    <h2 id="selTitle">选择一个批次查看详情 / 指标 / 日志</h2>
    <div id="detail"><div class="empty">点左侧批次。回测成功后这里显示每个 alpha 的 Sharpe / Fitness / 收益 / 换手 / 保证金 / check 状态。</div></div>
    <div id="checkPanel"></div>
  </div>
 </div>
</main>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let SEL=null, logAfter=0, logJob=null;
const stCls={QUEUED:'s-QUEUED',RUNNING:'s-RUNNING',COMPLETE:'s-COMPLETE',STOPPED:'s-STOPPED',ERROR:'s-ERROR'};
const stxCls={completed:'stx-COMPLETE',failed:'stx-ERROR',cancelled:'stx-ERROR',submitted:'stx-submitted',pending:'stx-QUEUED'};
async function j(url,opt){const r=await fetch(url,opt);return r.json()}
function esc(s){return (s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
// 指标数值: 保留到 3 位有效数字且去尾随 0, 如 0.04/-1.19/1.5; 空则 -
function num(v){ if(v===null||v===undefined||v===''||isNaN(v)) return '-';
  const n=Number(v); if(!isFinite(n)) return '-';
  return String(parseFloat(n.toPrecision(3))); }
// 百分比: 小数转 %, 去尾随0, 如 0.0215 -> 2.15%
function pct(v){ if(v===null||v===undefined||v===''||isNaN(v)) return '-';
  const n=Number(v)*100; if(!isFinite(n)) return '-';
  return String(parseFloat(n.toPrecision(3)))+'%'; }
function chkBadge(c){if(!c)return '<span class="badge b-none">no-check</span>';
  const m={'pass':'b-pass','warn':'b-warn','fail':'b-fail'}[c]||'b-none';return `<span class="badge ${m}">${esc(c)}</span>`}
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',6000)}
async function refresh(){
  const d=await j('/api/jobs').catch(()=>null);
  if(!d) return;
  $('#health').textContent=new Date().toLocaleTimeString()+' · '+d.jobs.length+' 个批次';
  // daemon 已按创建时间倒序(最新在前); 再按 id 高位倒序兜底, 确保最新批次在最上
  const jobs = (d.jobs||[]).slice().sort((a,b)=>String(b.id).localeCompare(String(a.id)));
  $('#jobs').innerHTML=jobs.map(x=>{
    const pct=x.total?Math.round(x.done/x.total*100):0;
    const bn=x.round||x.id;
    return `<div class="job" onclick="sel('${x.id}')">
      <span class="round">${esc(bn)}</span>
      <span class="state ${stCls[x.state]||''}">${x.state}</span>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;gap:8px">
          <b>${esc(x.name)}</b><span class="meta">${x.done}/${x.total} (${pct}%)</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="meta">${esc(x.producer||'')} · ${new Date(x.created_at*1000).toLocaleString()}</div>
      </div></div>`;
  }).join('') || '<div class="empty">暂无批次</div>';
  if(SEL) loadDetail(SEL);
}
async function loadDetail(id){
  loadDetail.cancel&&loadDetail.cancel();
  const ctl=new AbortController(); loadDetail.cancel=()=>ctl.abort();
  const d=await j('/api/jobs/'+id,{signal:ctl.signal}).catch(()=>null);
  if(!d||SEL!==id) return;
  const x=d.job||d;
  $('#selTitle').textContent=(x.round?'R'+x.round+' · ':'')+(x.name||id);
  const by={};
  (x.results||[]).forEach(r=>by[r.status]=(by[r.status]||0)+1);
  const statChips=Object.keys(by).length?Object.entries(by).map(([k,v])=>
    `<span class="stat">${esc(k)} <span class="n">${v}</span></span>`).join(''):'<span class="empty">尚无结果(排队或在跑)</span>';
  const rows=(x.results||[]).map(r=>{
    const s=r.status||'pending'; const m=r.metrics||{};
    return `<div class="expr"><span class="st ${stxCls[s]||'stx-QUEUED'}">${esc(s)}</span>`+
      `<span class="aid" title="${esc(r.alpha_id||'')}">${esc(r.alpha_id||'')}</span>`+
      `<span class="m">${num(m.sharpe)}</span><span class="m">${num(m.fitness)}</span>`+
      `<span class="m">${pct(m.returns)}</span><span class="m">${pct(m.turnover)}</span>`+
      `<span class="m">${m.margin!=null?(m.margin*10000).toFixed(1)+'bp':'-'}</span>`+
      chkBadge(m.check_status)+
      `<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis" title="${esc(r.expression)}">${esc(r.expression)}</span>`+
      (r.error?`<span class="stx-ERROR" title="${esc(r.error)}">!</span>`:'')+`</div>`;
  }).join('');
  const running=x.state==='RUNNING';
  const okRows=(x.results||[]).filter(r=>r.status==='completed').length;
  $('#detail').innerHTML=`
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
      <span class="state ${stCls[x.state]||''}">${x.state}</span>
      <span class="meta">${x.done}/${x.total} 完成</span>
      <span class="meta">批次 ${esc(x.id)}</span>
      <span style="flex:1"></span>
      ${running?`<button onclick="doAction('${x.id}','pause')">暂停</button>
                 <button onclick="doAction('${x.id}','resume')" style="margin-left:4px">恢复</button>
                 <button class="danger" onclick="doAction('${x.id}','cancel')">取消</button>`
               :(okRows?`<button class="ok" onclick="window.open('/api/jobs/${x.id}/result')">结果 JSON</button>`:'')+
                `<button onclick="doResume('${x.id}')" style="margin-left:4px">断点续跑</button>`}
    </div>
    <div class="card" style="margin:0 0 8px;padding:8px 12px"><h2 style="margin:0 0 4px">批次结果统计</h2>${statChips}</div>
    <div class="card" style="margin:0 0 8px;padding:8px 12px">
      <h2 style="margin:0 0 4px">表达式明细 · 指标(is 口径)</h2>
      <div class="headrow"><span class="st">状态</span><span class="aid">alpha</span>
        <span class="m">Sharpe</span><span class="m">Fitness</span><span class="m">收益%</span>
        <span class="m">换手%</span><span class="m">保证金</span><span class="m" style="width:auto;text-align:left">check</span><span>表达式</span></div>
      <div>${rows||'<div class="empty">等待派发…</div>'}</div></div>
    <div class="card" style="margin:0"><h2>实时日志</h2>
      <div id="log"><div class="empty">等待日志…</div></div></div>`;
  if(logJob!==id){logAfter=0;logJob=id;}
  const lg=await j(`/api/jobs/${id}/log?after=${logAfter}`).catch(()=>null);
  if(lg&&lg.lines&&lg.lines.length){logAfter=lg.after;
    const el=$('#log'); el.textContent=(el.textContent==='等待日志…'?'':el.textContent)+
      lg.lines.map(l=>l.line).join('\n')+'\n'; el.scrollTop=el.scrollHeight;}
}
async function refreshMeta(){
  const h=await j('/health').catch(()=>null);
  if(h){$('#concInput').value=h.concurrent; $('#bsInput').value=h.batch_size;}
  const q=await j('/api/quota').catch(()=>null);
  if(q&&q.quota){const r=q.quota; $('#qty').textContent=`${r.remaining}/${r.limit}(resets ${Math.round(r.reset_sec/60)}min)`;}
  else $('#qty').textContent='-';
}
async function applyAction(){
  const n=parseInt($('#concInput').value,10); const m=parseInt($('#bsInput').value,10);
  const r=await j('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({concurrent:n||3,batch_size:m||10})}).catch(()=>null);
  if(r){toast(`并发已改为 ${r.concurrent},批大小 ${r.batch_size}`);} else toast('修改失败');
}
async function doAction(id,action){
  await j('/api/jobs/'+id,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action})});
  toast(`${action} 已请求`); refresh();
}
async function doResume(id){
  await j(`/api/jobs/${id}/resume`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  toast('断点续跑已启动'); refresh();
}
async function submitJob(){
  const btn=$('#fSubmit'); btn.disabled=true;
  try{
    let settings; try{settings=JSON.parse($('#fSettings').value)}catch(e){toast('settings JSON 解析失败: '+e.message);return}
    const exprs=$('#fExprs').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!exprs.length){toast('至少一条表达式');return}
    const body={name:$('#fName').value.trim()||null,producer:$('#fProd').value.trim()||'控制台',
      settings,expressions:exprs};
    const c=$('#fCap').value; if(c!=='')body.cap=parseInt(c,10);
    const r=await j('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    $('#fResult').textContent=`${r.round||''} · ${r.total} 条`;
    toast(`已提交批次 ${r.id||'(全部已跑过)'},${r.total} 条`);
    $('#fExprs').value=''; refresh();
  }catch(e){toast('提交失败: '+e.message)}
  finally{btn.disabled=false}
}
function sel(id){SEL=id;refresh();}
// ── check / prod_corr / local self-corr ──
let activeCheckAlpha=null;
async function showCheckPanel(alphaId,type){
  activeCheckAlpha=alphaId;
  const panel=$('#checkPanel');
  panel.innerHTML='<div class="check-loading">加载中…</div>';
  try{
    if(type==='check'){
      const d=await j('/api/alphas/'+encodeURIComponent(alphaId)+'/check');
      const checks=d?.is?.checks||[];
      const pass=checks.filter(c=>c.result==='PASS').length;
      const fail=checks.filter(c=>c.result==='FAIL').length;
      const warn=checks.filter(c=>c.result==='WARNING').length;
      const pend=checks.filter(c=>c.result==='PENDING').length;
      const pc=checks.find(c=>c.name==='PROD_CORRELATION');
      panel.innerHTML=`<h3>BRAIN check · ${esc(alphaId)}<span class="close" onclick="closeCheck()">✕</span></h3>
        <div class="check-summary">
          ${pass?`<span class="badge b-pass">${pass} pass</span>`:''}
          ${fail?`<span class="badge b-fail">${fail} fail</span>`:''}
          ${warn?`<span class="badge b-warn">${warn} warn</span>`:''}
          ${pend?`<span class="badge b-none">${pend} pending</span>`:''}
        </div>
        ${checks.map(c=>`<div class="check-row"><span class="check-name">${esc(c.name)}</span>
          <span class="check-val">${c.value!=null?num(c.value):c.limit!=null?'限 '+num(c.limit):''}</span>
          <span class="check-result">${chkBadge((c.result||'').toLowerCase())}</span></div>`).join('')}`;
    }else if(type==='prod_corr'){
      const d=await j('/api/alphas/'+encodeURIComponent(alphaId)+'/correlations/prod');
      const mx=d?.max; const mn=d?.min;
      const deadZone=mx!=null&&mx>=0.7;
      const margin=mx!=null?Math.max(0,(0.7-mx)):null;
      panel.innerHTML=`<h3>prod corr · ${esc(alphaId)}<span class="close" onclick="closeCheck()">✕</span></h3>
        <div class="check-row"><span class="check-name">max</span><span class="check-val" style="color:${deadZone?'var(--err)':'var(--ok)'};font-weight:700">${mx!=null?num(mx):'—'}</span></div>
        <div class="check-row"><span class="check-name">min</span><span class="check-val">${mn!=null?num(mn):'—'}</span></div>
        <div class="check-row"><span class="check-name">margin (0.7-max)</span><span class="check-val" style="color:${margin!=null&&margin>=0.05?'var(--ok)':'var(--err)'}">${margin!=null?num(margin):'—'}</span></div>
        ${deadZone?`<div style="margin-top:6px;padding:6px 8px;background:#3f1216;border-radius:6px;color:var(--err)">⚠ max prod_corr ≥ 0.70 死区线，此 alpha 大概率 submission FAIL</div>`:''}
        ${!deadZone&&mx!=null?`<div style="margin-top:6px;padding:6px 8px;background:#0f2b18;border-radius:6px;color:var(--ok)">✓ 安全边际 ${num(margin)}（死区线 0.70）</div>`:''}
        <div class="meta" style="margin-top:6px">候选集：${d?.records?.length??0} 条</div>`;
    }else if(type==='local'){
      // 本地 SELF_CORRELATION：下载目标 PnL → 下载缓存里所有 alpha PnL → Pearson
      const targetResp=await j('/api/pnl-cache/'+encodeURIComponent(alphaId));
      const cacheList=await j('/api/pnl-cache');
      const otherIds=(cacheList.items||[]).map(i=>i.alpha_id).filter(id=>id!==alphaId);
      if(!otherIds.length){
        panel.innerHTML=`<h3>本地 SELF_CORRELATION · ${esc(alphaId)}<span class="close" onclick="closeCheck()">✕</span></h3><div class="check-loading">无其它缓存 alpha 可对比</div>`;return;
      }
      // 并发拉候选 PnL（限流 4 个）
      const cands=[];
      for(let i=0;i<otherIds.length;i+=4){
        const batch=otherIds.slice(i,i+4);
        const results=await Promise.all(batch.map(async aid=>{
          try{const p=await j('/api/pnl-cache/'+encodeURIComponent(aid));return{aid,records:p.records||[]};}
          catch{return{aid,records:[]};}
        }));
        cands.push(...results);
      }
      const valid=cands.filter(c=>c.records.length>0);
      // 计算 Pearson
      function pnlReturns(recs){
        const out=[];for(let i=1;i<recs.length;i++){
          const cur=recs[i]?.pnl,prev=recs[i-1]?.pnl;
          if(typeof cur==='number'&&typeof prev==='number'&&isFinite(cur)&&isFinite(prev))out.push(cur-prev);
        }return out;}
      function pearson(a,b){const n=Math.min(a.length,b.length);if(n<2)return NaN;let sx=0,sy=0;for(let i=0;i<n;i++){sx+=a[i];sy+=b[i];}const mx=sx/n,my=sy/n;let num=0,dx=0,dy=0;for(let i=0;i<n;i++){const dxi=a[i]-mx;const dyi=b[i]-my;num+=dxi*dyi;dx+=dxi*dxi;dy+=dyi*dyi;}const den=Math.sqrt(dx*dy);return den===0?NaN:num/den;}
      const tgtReturns=pnlReturns(targetResp.records||[]);
      const perCandidate=valid.map(c=>{const cRet=pnlReturns(c.records);const n=Math.min(tgtReturns.length,cRet.length);if(n<30)return{aid:c.aid,corr:null,overlap:n};const corr=pearson(tgtReturns.slice(0,n),cRet.slice(0,n));return{aid:c.aid,corr:isNaN(corr)?null:corr,overlap:n};});
      let maxCorr=null,minCorr=null;
      perCandidate.forEach(c=>{if(c.corr!==null){if(maxCorr===null||c.corr>maxCorr)maxCorr=c.corr;if(minCorr===null||c.corr<minCorr)minCorr=c.corr;}});
      panel.innerHTML=`<h3>本地 SELF_CORRELATION · ${esc(alphaId)}<span class="close" onclick="closeCheck()">✕</span></h3>
        <div class="check-row"><span class="check-name">候选数</span><span class="check-val">${perCandidate.length}</span></div>
        <div class="check-row"><span class="check-name">target 日数</span><span class="check-val">${(targetResp.records||[]).length}</span></div>
        <div class="check-row"><span class="check-name" style="font-weight:700">max</span><span class="check-val" style="color:${maxCorr!=null&&maxCorr>=0.7?'var(--err)':'var(--ok)'};font-weight:700">${maxCorr!=null?num(maxCorr):'—'}</span></div>
        ${perCandidate.map(c=>`<div class="pc-row"><span class="pc-name">${esc(c.aid)}</span><span style="width:50px;text-align:right;font-size:11px;color:var(--dim)">${c.overlap}d</span><span class="pc-val" style="color:${c.corr!==null&&c.corr>=0.7?'var(--err)':'var(--ok)'}">${c.corr!==null?num(c.corr):'n/a'}</span></div>`).join('')}
        <div class="meta" style="margin-top:6px">BRAIN SELF_CORRELATION PENDING 时本面板立即可读；PASS 后两者差异 ≤0.05</div>`;
    }
  }catch(e){panel.innerHTML=`<h3>Error<span class="close" onclick="closeCheck()">✕</span></h3><div style="color:var(--err)">${esc(String(e))}</div>`;}
}
