# @deepseek-ai/dsh-qianxun-tab bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published package: when the
# plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add @deepseek-ai/dsh-qianxun-tab@<version>
#
# — the command appends `dsh-qianxun-tab` to the profile's bundle stack and the
# profile boot merges THIS patch, mounting the plugin's node entry (an empty
# apply). The actual 千寻 tab is registered in the BROWSER by the client half
# (exports["./client"], discovered via the package.json `dsh.client.platform=web`
# declaration and `dsh.client.inject`), so this node row exists only to make the
# plugin a first-class member of the profile bundle stack and to satisfy the
# bare-import of "." (node index.js). It injects nothing and performs no host
# work; it must NOT declare `betterSidebar` (that service is client-side).
#
# If a profile still carries a manual mount line for this package in its own
# cordis.patch.yml, remove it before switching to the bundle channel to avoid
# double-mounting.
- insert:
    - id: qianxun-tab
      name: '@deepseek-ai/dsh-qianxun-tab'
