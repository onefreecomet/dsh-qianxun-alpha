name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Syntax check
        run: |
          python -m py_compile qianxund.py
          python -m py_compile qianxun_cli.py
          find qianxun_engine -name "*.py" -exec python -m py_compile {} +
      - name: Import check
        run: |
          python -c "import ast; [ast.parse(open(f).read()) for f in __import__('glob').glob('**/*.py', recursive=True)]"
      - name: Verify README sections
        run: |
          python -c "
          import re
          content = open('README.md').read()
          required = ['安装', 'DSH 侧边栏', 'API', '安全', '故障排查']
          missing = [s for s in required if s not in content]
          assert not missing, f'Missing sections: {missing}'
          print('README OK: all required sections present')
          "
